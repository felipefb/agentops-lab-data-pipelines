name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      AGENTOPS_ROOT: ${{ github.workspace }}/_workspace   # CI workspace, NOT a Windows E: run
      AGENTOPS_ARTIFACTS_DIR: ${{ github.workspace }}/_workspace/artifacts
      DUCKDB_TMP_DIR: ${{ github.workspace }}/_workspace/tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.lock.txt
      - run: ruff check agentops tests evaluations apps/api
      - run: python -m pytest -q
      - run: python -m agentops.benchmark --seeds 101 --classes duplicates timeout skew --baseline-reps 1 --no-llm --run-id ci
      - run: python evaluations/audit_metrics.py _workspace/artifacts/runs/ci
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npx tsc --noEmit -p . && npx vite build
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python scripts/scan_secrets.py
